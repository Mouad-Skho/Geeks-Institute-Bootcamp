<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Study Planner</h1>
        <h4>A simple plan for a productive study day.</h4>
    </header>
    <main>
        <section>
            <h1>What to bring</h1>
            <ul>
                <li>Laptop</li>
                <li>Notebook</li>
                <li>Pen</li>
            </ul>
        </section>
        <section>
            <h1>My study steps</h1>
            <ol>
                <li>Review the lesson</li>
                <li>Complete the exercise</li>
                <li>Check my work</li>
            </ol>
        </section>
    </main>
</body>
</html>
